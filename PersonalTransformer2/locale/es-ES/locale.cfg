[technology-description]
personal-transformer-equipment=Se inserta en la armadura para permitir la carga desde la red eléctrica. Carga hasta 200 kW.
personal-transformer-mk2-equipment=Permite una carga mejorada desde la red eléctrica. Carga hasta 1 MW.
personal-transformer-mk3-equipment=Permite al jugador provocar apagones en puestos avanzados. Carga hasta 4 MW.
personal-transformer-efficiency=Aumenta la capacidad máxima de entrada, salida y búfer de todos los transformadores personales. Nota: Las bonificaciones investigadas se aplican en el juego, pero no aparecerán en las descripciones de los objetos ni en la Factoriopedia.

