[mod-setting-description]
personal-transformer2-allow-non-armor=Permite colocar transformadores personales en cuadrículas de equipamiento que no sean armaduras.
personal-transformer2-tick-delay=Controla la frecuencia con la que se ejecuta el script del transformador (en ticks). Valores más bajos ofrecen actualizaciones más fluidas con un coste ligeramente mayor de UPS; valores más altos ahorran UPS.
personal-transformer2-default-vehicle-in=Define si los vehículos recién colocados con transformadores personales comienzan con la carga desde la red (Entrada) activada.
personal-transformer2-default-vehicle-out=Define si los vehículos recién colocados con transformadores personales comienzan con la descarga a la red (Salida) activada.
personal-transformer2-enable-research=Añade una tecnología infinita que aumenta la tasa de transferencia y la capacidad de búfer de todos los transformadores personales.
personal-transformer2-research-bonus-type=Elige si cada nivel de investigación añade un multiplicador porcentual o una bonificación fija en kW.
personal-transformer2-research-bonus=Cantidad añadida por nivel investigado (porcentaje en modo porcentual, o kW en modo fijo).
personal-transformer2-research-cost-formula=Coste de paquetes de ciencia por nivel L (empieza en 1).\nSoporta: + - * / % ^ ( ) y floor, ceil, round, min, max, log, ln.\nDebe evaluar > 0 para todos los niveles (sin sintaxis Lua).\nEjemplos: (1.5 ^ (L - 1)) * 1000  |  2^(L - 1) * 1000  |  L * 1000
personal-transformer-mk1-flow-limit=Establece la tasa máxima de entrada del transformador personal MK1 en kW.
personal-transformer-mk1-output-limit=Establece la tasa máxima de salida del transformador personal MK1 en kW.
personal-transformer-mk1-buffer-capacity=Establece la capacidad del búfer interno de energía del transformador personal MK1 en kJ.
personal-transformer-mk2-flow-limit=Establece la tasa máxima de entrada del transformador personal MK2 en kW.
personal-transformer-mk2-output-limit=Establece la tasa máxima de salida del transformador personal MK2 en kW.
personal-transformer-mk2-buffer-capacity=Establece la capacidad del búfer interno de energía del transformador personal MK2 en kJ.
personal-transformer-mk3-flow-limit=Establece la tasa máxima de entrada del transformador personal MK3 en kW.
personal-transformer-mk3-output-limit=Establece la tasa máxima de salida del transformador personal MK3 en kW.
personal-transformer-mk3-buffer-capacity=Establece la capacidad del búfer interno de energía del transformador personal MK3 en kJ.

