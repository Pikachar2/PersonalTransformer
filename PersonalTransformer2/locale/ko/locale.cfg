[mod-name]
PersonalTransformer2=개인용 변압기 2

[mod-description]
PersonalTransformer2=아머 및 차량의 장비 격자에 장착하여 전력망으로부터 충전하거나 전력망으로 전력을 공급할 수 있는 장비 모듈입니다.

