[technology-description]
personal-transformer-equipment=아머에 장착하여 전력망으로부터 배터리를 충전할 수 있습니다. 최대 200 kW로 충전합니다.
personal-transformer-mk2-equipment=전력망 충전 속도를 향상시킵니다. 최대 1 MW로 충전합니다.
personal-transformer-mk3-equipment=전초기지에 정전을 일으킬 수 있을 만큼 강력한 충전 속도를 제공합니다. 최대 4 MW로 충전합니다.
personal-transformer-efficiency=모든 개인용 변압기의 최대 입력, 출력 및 완충 용량을 증가시킵니다. 참고: 연구 보너스는 게임 내에 실제 적용되지만 아이템 툴팁이나 팩토리오피디아에는 표시되지 않습니다.

[modifier-description]
personal-transformer-efficiency=개인용 변압기 전송 속도 및 완충 용량: +__1__%
personal-transformer-efficiency-flat=개인용 변압기 전송 속도: +__1__ kW

[mod-setting-name]
personal-transformer2-allow-non-armor=아머 외 장비 격자에서 개인용 변압기 허용
personal-transformer2-tick-delay=틱 지연 시간 설정
personal-transformer2-default-vehicle-in=차량 기본 입력 활성화
personal-transformer2-default-vehicle-out=차량 기본 출력 활성화
personal-transformer2-enable-research=무한 용량 연구 활성화
personal-transformer2-research-bonus-type=연구 보너스 방식
personal-transformer2-research-bonus=레벨당 연구 보너스 (% 또는 kW)
personal-transformer2-research-cost-formula=연구 과학 팩 비용 공식
personal-transformer-mk1-flow-limit=개인용 변압기 MK1 입력 값 (kW)
personal-transformer-mk1-output-limit=개인용 변압기 MK1 출력 값 (kW)
personal-transformer-mk1-buffer-capacity=개인용 변압기 MK1 완충 용량 (kJ)
personal-transformer-mk2-flow-limit=개인용 변압기 MK2 입력 값 (kW)
personal-transformer-mk2-output-limit=개인용 변압기 MK2 출력 값 (kW)
personal-transformer-mk2-buffer-capacity=개인용 변압기 MK2 완충 용량 (kJ)
personal-transformer-mk3-flow-limit=개인용 변압기 MK3 입력 값 (kW)
personal-transformer-mk3-output-limit=개인용 변압기 MK3 출력 값 (kW)
personal-transformer-mk3-buffer-capacity=개인용 변압기 MK3 완충 용량 (kJ)

[mod-setting-description]
personal-transformer2-allow-non-armor=차량 등 아머가 아닌 장비 격자에도 개인용 변압기를 장착할 수 있도록 허용합니다.
personal-transformer2-tick-delay=변압기 스크립트가 실행되는 주기를 틱 단위로 설정합니다. 값이 낮을수록 더 부드럽게 작동하지만 UPS 부하가 약간 증가하며, 값이 높을수록 UPS를 절약합니다.
personal-transformer2-default-vehicle-in=개인용 변압기가 장착된 새 차량을 배치할 때 전력망 충전(입력)을 기본으로 켤지 설정합니다.
personal-transformer2-default-vehicle-out=개인용 변압기가 장착된 새 차량을 배치할 때 전력망 방전(출력)을 기본으로 켤지 설정합니다.
personal-transformer2-enable-research=모든 개인용 변압기의 전송 속도와 완충 용량을 높이는 무한 기술을 추가합니다.
personal-transformer2-research-bonus-type=연구 레벨마다 백분율 배율을 추가할지 고정 kW 보너스를 추가할지 선택합니다.
personal-transformer2-research-bonus=연구된 레벨당 추가되는 수치입니다(백분율 모드에서는 %, 고정 모드에서는 kW).
personal-transformer2-research-cost-formula=레벨 L(1부터 시작)당 과학 팩 소모량 공식입니다.\n지원 연산자 및 함수: + - * / % ^ ( ) 및 floor, ceil, round, min, max, log, ln.\n모든 레벨에서 0보다 큰 값을 반환해야 합니다(Lua 문법 불가).\n예시: (1.5 ^ (L - 1)) * 1000  |  2^(L - 1) * 1000  |  L * 1000
personal-transformer-mk1-flow-limit=개인용 변압기 MK1의 최대 입력 전력을 kW 단위로 설정합니다.
personal-transformer-mk1-output-limit=개인용 변압기 MK1의 최대 출력 전력을 kW 단위로 설정합니다.
personal-transformer-mk1-buffer-capacity=개인용 변압기 MK1의 내부 에너지 완충 용량을 kJ 단위로 설정합니다.
personal-transformer-mk2-flow-limit=개인용 변압기 MK2의 최대 입력 전력을 kW 단위로 설정합니다.
personal-transformer-mk2-output-limit=개인용 변압기 MK2의 최대 출력 전력을 kW 단위로 설정합니다.
personal-transformer-mk2-buffer-capacity=개인용 변압기 MK2의 내부 에너지 완충 용량을 kJ 단위로 설정합니다.
personal-transformer-mk3-flow-limit=개인용 변압기 MK3의 최대 입력 전력을 kW 단위로 설정합니다.
personal-transformer-mk3-output-limit=개인용 변압기 MK3의 최대 출력 전력을 kW 단위로 설정합니다.
personal-transformer-mk3-buffer-capacity=개인용 변압기 MK3의 내부 에너지 완충 용량을 kJ 단위로 설정합니다.

[string-mod-setting]
personal-transformer2-research-bonus-type-percentage=백분율 (%)
personal-transformer2-research-bonus-type-flat=고정값 (+kW)
