[mod-setting-description]
personal-transformer2-allow-non-armor=Erlaubt das Einsetzen persönlicher Transformatoren in Ausrüstungsgittern außerhalb von Rüstungen.
personal-transformer2-tick-delay=Steuert, wie oft das Transformator-Skript ausgeführt wird (in Ticks). Niedrigere Werte sorgen für gleichmäßigere Updates bei etwas höherer UPS-Last; höhere Werte sparen UPS.
personal-transformer2-default-vehicle-in=Legt fest, ob neu platzierte Fahrzeuge mit persönlichen Transformatoren standardmäßig mit aktiviertem Eingang (Laden) starten.
personal-transformer2-default-vehicle-out=Legt fest, ob neu platzierte Fahrzeuge mit persönlichen Transformatoren standardmäßig mit aktiviertem Ausgang (Entladen) starten.
personal-transformer2-enable-research=Fügt eine unendliche Technologie hinzu, die Übertragungsrate und Pufferkapazität aller persönlichen Transformatoren erhöht.
personal-transformer2-research-bonus-type=Wähle, ob jede Forschungsstufe einen prozentualen Multiplikator oder einen festen kW-Bonus hinzufügt.
personal-transformer2-research-bonus=Hinzugefügter Wert pro erforschter Stufe (Prozent im Prozentmodus oder kW im Festwertmodus).
personal-transformer2-research-cost-formula=Wissenschaftspaket-Kosten pro Stufe L (beginnt bei 1).\nUnterstützt: + - * / % ^ ( ) sowie floor, ceil, round, min, max, log, ln.\nMuss für alle Stufen > 0 ergeben (keine Lua-Syntax).\nBeispiele: (1.5 ^ (L - 1)) * 1000  |  2^(L - 1) * 1000  |  L * 1000
personal-transformer-mk1-flow-limit=Legt die maximale Eingangsleistung des persönlichen Transformators MK1 in kW fest.
personal-transformer-mk1-output-limit=Legt die maximale Ausgangsleistung des persönlichen Transformators MK1 in kW fest.
personal-transformer-mk1-buffer-capacity=Legt die interne Energiepufferkapazität des persönlichen Transformators MK1 in kJ fest.
personal-transformer-mk2-flow-limit=Legt die maximale Eingangsleistung des persönlichen Transformators MK2 in kW fest.
personal-transformer-mk2-output-limit=Legt die maximale Ausgangsleistung des persönlichen Transformators MK2 in kW fest.
personal-transformer-mk2-buffer-capacity=Legt die interne Energiepufferkapazität des persönlichen Transformators MK2 in kJ fest.
personal-transformer-mk3-flow-limit=Legt die maximale Eingangsleistung des persönlichen Transformators MK3 in kW fest.
personal-transformer-mk3-output-limit=Legt die maximale Ausgangsleistung des persönlichen Transformators MK3 in kW fest.
personal-transformer-mk3-buffer-capacity=Legt die interne Energiepufferkapazität des persönlichen Transformators MK3 in kJ fest.

