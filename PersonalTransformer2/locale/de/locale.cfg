[technology-description]
personal-transformer-equipment=Wird in Rüstungen eingesetzt, um das Laden über das Stromnetz zu ermöglichen. Lädt mit bis zu 200 kW.
personal-transformer-mk2-equipment=Ermöglicht schnelleres Laden über das Stromnetz. Lädt mit bis zu 1 MW.
personal-transformer-mk3-equipment=Ermöglicht es dem Spieler, Stromausfälle in Außenposten zu verursachen. Lädt mit bis zu 4 MW.
personal-transformer-efficiency=Erhöht die maximale Eingangs-, Ausgangs- und Pufferkapazität aller persönlichen Transformatoren. Hinweis: Erforschte Boni wirken im Spiel, werden aber nicht in Gegenstands-Tooltips oder der Faktoripädie angezeigt.

