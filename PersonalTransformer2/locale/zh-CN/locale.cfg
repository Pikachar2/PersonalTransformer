[technology-description]
personal-transformer-equipment=装入装甲以允许从电网充电。最高充电功率 200 kW。
personal-transformer-mk2-equipment=提供更强的电网充电能力。最高充电功率 1 MW。
personal-transformer-mk3-equipment=足以让玩家把前哨站抽到断电。最高充电功率 4 MW。
personal-transformer-efficiency=提高所有个人变压器的最大输入、输出功率和缓冲容量。注意：已研究的加成会在游戏中生效，但不会显示在物品提示或异星百科中。

[modifier-description]
personal-transformer-efficiency=个人变压器传输速率与缓冲容量：+__1__%
personal-transformer-efficiency-flat=个人变压器传输速率：+__1__ kW

[mod-setting-name]
personal-transformer2-allow-non-armor=允许在非装甲网格中使用个人变压器
personal-transformer2-tick-delay=设置更新间隔（Tick）
personal-transformer2-default-vehicle-in=默认开启载具输入
personal-transformer2-default-vehicle-out=默认开启载具输出
personal-transformer2-enable-research=启用无限容量研究
personal-transformer2-research-bonus-type=研究加成模式
personal-transformer2-research-bonus=每级研究加成（% 或 kW）
personal-transformer2-research-cost-formula=研究科技瓶消耗公式
personal-transformer-mk1-flow-limit=个人变压器 MK1 输入功率 (kW)
personal-transformer-mk1-output-limit=个人变压器 MK1 输出功率 (kW)
personal-transformer-mk1-buffer-capacity=个人变压器 MK1 缓冲容量 (kJ)
personal-transformer-mk2-flow-limit=个人变压器 MK2 输入功率 (kW)
personal-transformer-mk2-output-limit=个人变压器 MK2 输出功率 (kW)
personal-transformer-mk2-buffer-capacity=个人变压器 MK2 缓冲容量 (kJ)
personal-transformer-mk3-flow-limit=个人变压器 MK3 输入功率 (kW)
personal-transformer-mk3-output-limit=个人变压器 MK3 输出功率 (kW)
personal-transformer-mk3-buffer-capacity=个人变压器 MK3 缓冲容量 (kJ)

[mod-setting-description]
personal-transformer2-allow-non-armor=允许将个人变压器放入载具等非装甲装备网格中。
personal-transformer2-tick-delay=控制变压器脚本的运行频率（单位：Tick）。较低的值更新更平滑但略微增加 UPS 消耗；较高的值更节省 UPS。
personal-transformer2-default-vehicle-in=设置新放置的装有个人变压器的载具是否默认开启电网充电（输入）。
personal-transformer2-default-vehicle-out=设置新放置的装有个人变压器的载具是否默认开启向电网放电（输出）。
personal-transformer2-enable-research=添加一项无限科技，用于提高所有个人变压器的传输速率和缓冲容量。
personal-transformer2-research-bonus-type=选择每级研究为个人变压器增加百分比倍率还是固定 kW 加成。
personal-transformer2-research-bonus=每级研究增加的数值（百分比模式下为百分比，固定模式下为 kW）。
personal-transformer2-research-cost-formula=每级 L（从 1 开始）的科技瓶消耗公式。\n支持运算符与函数：+ - * / % ^ ( ) 以及 floor, ceil, round, min, max, log, ln。\n所有等级的计算结果必须 > 0（不可使用 Lua 语法）。\n示例：(1.5 ^ (L - 1)) * 1000  |  2^(L - 1) * 1000  |  L * 1000
personal-transformer-mk1-flow-limit=设置个人变压器 MK1 的最大输入功率（单位：kW）。
personal-transformer-mk1-output-limit=设置个人变压器 MK1 的最大输出功率（单位：kW）。
personal-transformer-mk1-buffer-capacity=设置个人变压器 MK1 的内部能量缓冲容量（单位：kJ）。
personal-transformer-mk2-flow-limit=设置个人变压器 MK2 的最大输入功率（单位：kW）。
personal-transformer-mk2-output-limit=设置个人变压器 MK2 的最大输出功率（单位：kW）。
personal-transformer-mk2-buffer-capacity=设置个人变压器 MK2 的内部能量缓冲容量（单位：kJ）。
personal-transformer-mk3-flow-limit=设置个人变压器 MK3 的最大输入功率（单位：kW）。
personal-transformer-mk3-output-limit=设置个人变压器 MK3 的最大输出功率（单位：kW）。
personal-transformer-mk3-buffer-capacity=设置个人变压器 MK3 的内部能量缓冲容量（单位：kJ）。

[string-mod-setting]
personal-transformer2-research-bonus-type-percentage=百分比 (%)
personal-transformer2-research-bonus-type-flat=固定值 (+kW)
