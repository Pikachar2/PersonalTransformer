[technology-description]
personal-transformer-equipment=Wkładany do pancerza, pozwala na ładowanie z sieci energetycznej. Ładuje z mocą do 200 kW.
personal-transformer-mk2-equipment=Pozwala na szybsze ładowanie z sieci energetycznej. Ładuje z mocą do 1 MW.
personal-transformer-mk3-equipment=Pozwala graczowi powodować awarie zasilania w posterunkach. Ładuje z mocą do 4 MW.
personal-transformer-efficiency=Zwiększa maksymalną moc wejściową, wyjściową oraz pojemność bufora wszystkich osobistych transformatorów. Uwaga: zbadane premie działają w grze, ale nie są widoczne w opisach przedmiotów ani w Faktorii-pedii.

