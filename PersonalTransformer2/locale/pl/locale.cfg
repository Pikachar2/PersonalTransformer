[mod-setting-description]
personal-transformer2-allow-non-armor=Pozwala na umieszczanie osobistych transformatorów w siatkach wyposażenia pojazdów.
personal-transformer2-tick-delay=Określa, jak często uruchamia się skrypt transformatora (w tikach). Niższe wartości zapewniają płynniejsze aktualizacje kosztem nieco większego obciążenia UPS; wyższe wartości oszczędzają UPS.
personal-transformer2-default-vehicle-in=Określa, czy nowo postawione pojazdy z osobistymi transformatorami mają domyślnie włączone ładowanie z sieci (Wejście).
personal-transformer2-default-vehicle-out=Określa, czy nowo postawione pojazdy z osobistymi transformatorami mają domyślnie włączone oddawanie energii do sieci (Wyjście).
personal-transformer2-enable-research=Dodaje nieskończoną technologię zwiększającą szybkość przesyłu i pojemność bufora wszystkich osobistych transformatorów.
personal-transformer2-research-bonus-type=Wybierz, czy każdy poziom badań dodaje mnożnik procentowy, czy stałą premię w kW.
personal-transformer2-research-bonus=Wartość dodawana na każdy zbadany poziom (procent w trybie procentowym lub kW w trybie stałym).
personal-transformer2-research-cost-formula=Koszt pakietów naukowych na poziom L (zaczyna się od 1).\nObsługuje: + - * / % ^ ( ) oraz floor, ceil, round, min, max, log, ln.\nMusi dawać wynik > 0 dla wszystkich poziomów (bez składni Lua).\nPrzykłady: (1.5 ^ (L - 1)) * 1000  |  2^(L - 1) * 1000  |  L * 1000
personal-transformer-mk1-flow-limit=Ustawia maksymalną moc wejściową osobistego transformatora MK1 w kW.
personal-transformer-mk1-output-limit=Ustawia maksymalną moc wyjściową osobistego transformatora MK1 w kW.
personal-transformer-mk1-buffer-capacity=Ustawia pojemność wewnętrznego bufora energii osobistego transformatora MK1 w kJ.
personal-transformer-mk2-flow-limit=Ustawia maksymalną moc wejściową osobistego transformatora MK2 w kW.
personal-transformer-mk2-output-limit=Ustawia maksymalną moc wyjściową osobistego transformatora MK2 w kW.
personal-transformer-mk2-buffer-capacity=Ustawia pojemność wewnętrznego bufora energii osobistego transformatora MK2 w kJ.
personal-transformer-mk3-flow-limit=Ustawia maksymalną moc wejściową osobistego transformatora MK3 w kW.
personal-transformer-mk3-output-limit=Ustawia maksymalną moc wyjściową osobistego transformatora MK3 w kW.
personal-transformer-mk3-buffer-capacity=Ustawia pojemność wewnętrznego bufora energii osobistego transformatora MK3 w kJ.

