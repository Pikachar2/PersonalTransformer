[mod-setting-description]
personal-transformer2-allow-non-armor=Allow Personal Transformer to be placed in non-armor grids.
personal-transformer2-tick-delay=Controls how often the transformer script runs (in ticks). Lower values give smoother updates at slightly higher UPS cost; higher values save UPS.
personal-transformer2-default-vehicle-in=Sets whether newly placed vehicles with Personal Transformers start with grid charging (Input) enabled.
personal-transformer2-default-vehicle-out=Sets whether newly placed vehicles with Personal Transformers start with grid discharging (Output) enabled.
personal-transformer2-enable-research=Adds an infinite technology that increases the transfer rate and buffer capacity of all personal transformers.
personal-transformer2-research-bonus-type=Choose whether each research level adds a percentage multiplier or a flat kW bonus to personal transformers.
personal-transformer2-research-bonus=Amount added per researched level (percentage when set to percentage mode, or kW when set to flat mode).
personal-transformer2-research-cost-formula=Science pack cost per level L (starts at 1).\nSupports: + - * / % ^ ( ) and floor, ceil, round, min, max, log, ln.\nMust evaluate > 0 for all levels (no Lua syntax).\nExamples: (1.5 ^ (L - 1)) * 1000  |  2^(L - 1) * 1000  |  L * 1000
personal-transformer-mk1-flow-limit=Sets the maximum input flow rate of the Personal Transformer MK1 in kW.
personal-transformer-mk1-output-limit=Sets the maximum output flow rate of the Personal Transformer MK1 in kW.
personal-transformer-mk1-buffer-capacity=Sets the internal energy buffer capacity of the Personal Transformer MK1 in kJ.
personal-transformer-mk2-flow-limit=Sets the maximum input flow rate of the Personal Transformer MK2 in kW.
personal-transformer-mk2-output-limit=Sets the maximum output flow rate of the Personal Transformer MK2 in kW.
personal-transformer-mk2-buffer-capacity=Sets the internal energy buffer capacity of the Personal Transformer MK2 in kJ.
personal-transformer-mk3-flow-limit=Sets the maximum input flow rate of the Personal Transformer MK3 in kW.
personal-transformer-mk3-output-limit=Sets the maximum output flow rate of the Personal Transformer MK3 in kW.
personal-transformer-mk3-buffer-capacity=Sets the internal energy buffer capacity of the Personal Transformer MK3 in kJ.

[string-mod-setting]
personal-transformer2-research-bonus-type-percentage=Percentage (%)
personal-transformer2-research-bonus-type-flat=Flat (+kW)
