[technology-description]
personal-transformer-equipment=Inserted into armor to allow charging from the power grid. Charges at up to 200 kW.
personal-transformer-mk2-equipment=Allows for improved charging from the power grid. Charges at up to 1 MW.
personal-transformer-mk3-equipment=Allows the player to cause blackouts at outposts. Charges at up to 4 MW.
personal-transformer-efficiency=Increases the maximum input, output, and buffer capacity of all personal transformers. Note: Researched bonuses apply in-game but will not appear on item tooltips or in Factoriopedia.

[modifier-description]
personal-transformer-efficiency=Personal transformer transfer rate & buffer: +__1__%
personal-transformer-efficiency-flat=Personal transformer transfer rate: +__1__ kW

