[mod-name]
PersonalTransformer2=パーソナルトランスフォーマー 2

[mod-description]
PersonalTransformer2=アーマーや車両に装着し、電力網からの充電および電力網への給電を可能にする装備モジュール。

[controls]
toggle-equipment-transformer-input=パーソナルトランスフォーマーの入力を切り替え
toggle-equipment-transformer-output=パーソナルトランスフォーマーの出力を切り替え

[gui]
personal-transformer-title=パーソナルトランスフォーマー

