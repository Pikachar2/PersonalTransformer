personal-transformer-mk2-output-entity=パーソナルトランスフォーマー MK2
personal-transformer-mk3-input-entity=パーソナルトランスフォーマー MK3
personal-transformer-mk3-output-entity=パーソナルトランスフォーマー MK3

[equipment-name]
personal-transformer-equipment=パーソナルトランスフォーマー
personal-transformer-mk2-equipment=パーソナルトランスフォーマー MK2
personal-transformer-mk3-equipment=パーソナルトランスフォーマー MK3

[item-name]
personal-transformer-equipment=パーソナルトランスフォーマー
personal-transformer-mk2-equipment=パーソナルトランスフォーマー MK2
personal-transformer-mk3-equipment=パーソナルトランスフォーマー MK3

[shortcut]
toggle-equipment-transformer-input=パーソナルトランスフォーマーの入力を切り替え
toggle-equipment-transformer-output=パーソナルトランスフォーマーの出力を切り替え

[technology-name]
personal-transformer-equipment=パーソナルトランスフォーマー
personal-transformer-mk2-equipment=パーソナルトランスフォーマー MK2
personal-transformer-mk3-equipment=パーソナルトランスフォーマー MK3
personal-transformer-efficiency=パーソナルトランスフォーマー容量

[technology-description]
personal-transformer-equipment=アーマーに装着することで電力網からの充電が可能になります。最大 200 kW で充電します。
personal-transformer-mk2-equipment=電力網からの充電性能を向上させます。最大 1 MW で充電します。
personal-transformer-mk3-equipment=前哨基地を停電させるほどの電力供給が可能になります。最大 4 MW で充電します。
personal-transformer-efficiency=すべてのパーソナルトランスフォーマーの最大入力・出力およびバッファ容量を増加させます。注：研究ボーナスはゲーム内で適用されますが、アイテムのツールチップやファクタリオペディアには表示されません。

[modifier-description]
personal-transformer-efficiency=パーソナルトランスフォーマーの転送速度とバッファ容量：+__1__%
personal-transformer-efficiency-flat=パーソナルトランスフォーマーの転送速度：+__1__ kW

[mod-setting-name]
personal-transformer2-allow-non-armor=アーマー以外のグリッドでの使用を許可
personal-transformer2-tick-delay=ティック遅延の設定
personal-transformer2-default-vehicle-in=車両の入力をデフォルトで有効化
personal-transformer2-default-vehicle-out=車両の出力をデフォルトで有効化
personal-transformer2-enable-research=無限容量研究を有効化
personal-transformer2-research-bonus-type=研究ボーナスモード
personal-transformer2-research-bonus=レベルごとの研究ボーナス（% または kW）
personal-transformer2-research-cost-formula=研究コスト計算式
personal-transformer-mk1-flow-limit=パーソナルトランスフォーマー MK1 入力値 (kW)
personal-transformer-mk1-output-limit=パーソナルトランスフォーマー MK1 出力値 (kW)
personal-transformer-mk1-buffer-capacity=パーソナルトランスフォーマー MK1 バッファ容量 (kJ)
personal-transformer-mk2-flow-limit=パーソナルトランスフォーマー MK2 入力値 (kW)
personal-transformer-mk2-output-limit=パーソナルトランスフォーマー MK2 出力値 (kW)
personal-transformer-mk2-buffer-capacity=パーソナルトランスフォーマー MK2 バッファ容量 (kJ)
personal-transformer-mk3-flow-limit=パーソナルトランスフォーマー MK3 入力値 (kW)
personal-transformer-mk3-output-limit=パーソナルトランスフォーマー MK3 出力値 (kW)
personal-transformer-mk3-buffer-capacity=パーソナルトランスフォーマー MK3 バッファ容量 (kJ)

[mod-setting-description]
personal-transformer2-allow-non-armor=車両などのアーマー以外の装備グリッドにパーソナルトランスフォーマーを配置できるようにします。
personal-transformer2-tick-delay=トランスフォーマースクリプトの実行頻度（ティック単位）を制御します。値が小さいほど滑らかに更新されますが UPS 負荷がわずかに増え、値が大きいほど UPS を節約できます。
personal-transformer2-default-vehicle-in=パーソナルトランスフォーマーを搭載した新しい車両を配置した際、電力網からの充電（入力）をデフォルトで有効にするか設定します。
personal-transformer2-default-vehicle-out=パーソナルトランスフォーマーを搭載した新しい車両を配置した際、電力網への放電（出力）をデフォルトで有効にするか設定します。
personal-transformer2-enable-research=すべてのパーソナルトランスフォーマーの転送速度とバッファ容量を強化する無限テクノロジーを追加します。
personal-transformer2-research-bonus-type=研究レベルごとにパーセント倍率を加算するか、固定の kW ボーナスを加算するかを選択します。
personal-transformer2-research-bonus=研究レベルごとに加算される値（パーセントモード時は %、固定モード時は kW）。
personal-transformer2-research-cost-formula=レベル L（1から開始）ごとのサイエンスパック消費量。\n使用可能：+ - * / % ^ ( ) および floor, ceil, round, min, max, log, ln。\nすべてのレベルで 0 より大きい値になる必要があります（Lua 構文不可）。\n例：(1.5 ^ (L - 1)) * 1000  |  2^(L - 1) * 1000  |  L * 1000
personal-transformer-mk1-flow-limit=パーソナルトランスフォーマー MK1 の最大入力電力を kW 単位で設定します。
personal-transformer-mk1-output-limit=パーソナルトランスフォーマー MK1 の最大出力電力を kW 単位で設定します。
personal-transformer-mk1-buffer-capacity=パーソナルトランスフォーマー MK1 の内部エネルギーバッファ容量を kJ 単位で設定します。
personal-transformer-mk2-flow-limit=パーソナルトランスフォーマー MK2 の最大入力電力を kW 単位で設定します。
personal-transformer-mk2-output-limit=パーソナルトランスフォーマー MK2 の最大出力電力を kW 単位で設定します。
personal-transformer-mk2-buffer-capacity=パーソナルトランスフォーマー MK2 の内部エネルギーバッファ容量を kJ 単位で設定します。
personal-transformer-mk3-flow-limit=パーソナルトランスフォーマー MK3 の最大入力電力を kW 単位で設定します。
personal-transformer-mk3-output-limit=パーソナルトランスフォーマー MK3 の最大出力電力を kW 単位で設定します。
personal-transformer-mk3-buffer-capacity=パーソナルトランスフォーマー MK3 の内部エネルギーバッファ容量を kJ 単位で設定します。

[string-mod-setting]
personal-transformer2-research-bonus-type-percentage=パーセント (%)
personal-transformer2-research-bonus-type-flat=固定値 (+kW)
