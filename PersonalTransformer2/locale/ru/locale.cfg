personal-transformer-mk1-flow-limit=Значение входа персонального трансформатора МК1 (кВт)
personal-transformer-mk1-output-limit=Значение выхода персонального трансформатора МК1 (кВт)
personal-transformer-mk1-buffer-capacity=Ёмкость буфера персонального трансформатора МК1 (кДж)
