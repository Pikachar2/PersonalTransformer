[mod-setting-description]
personal-transformer2-allow-non-armor=Разрешает использовать персональный трансформатор не в сетках брони.
personal-transformer2-tick-delay=Эта переменная задержки контролирует как часто скрипты трансформатора работают. Мод ведёт себя нормально в любых значения от 1 до 60. Меньшие значения могут влиять на UPS, но лучше обновляется, когда большие значения меньше влияют на UPS, но более грубо обновляется.
personal-transformer2-default-vehicle-in=Определяет, включён ли приём энергии из сети по умолчанию для нового транспорта с персональным трансформатором.
personal-transformer2-default-vehicle-out=Определяет, включена ли отдача энергии в сеть по умолчанию для нового транспорта с персональным трансформатором.
personal-transformer2-enable-research=Добавляет бесконечную технологию, увеличивающую мощность передачи и ёмкость буфера всех персональных трансформаторов.
personal-transformer2-research-bonus-type=Выберите, добавляет ли каждый уровень исследования процентный множитель или фиксированный бонус в кВт.
personal-transformer2-research-bonus=Значение бонуса за уровень (в процентах или в кВт в зависимости от выбранного режима).
personal-transformer2-research-cost-formula=Стоимость колб за уровень L (начинается с 1).\nОператоры и функции: + - * / % ^ ( ), floor, ceil, round, min, max, log, ln.\nРезультат должен быть > 0 для всех уровней (без синтаксиса Lua).\nПримеры: (1.5 ^ (L - 1)) * 1000  |  2^(L - 1) * 1000  |  L * 1000
personal-transformer-mk1-flow-limit=Устанавливает максимальную входную мощность персонального трансформатора МК1 в кВт.
personal-transformer-mk1-output-limit=Устанавливает максимальную выходную мощность персонального трансформатора МК1 в кВт.
personal-transformer-mk1-buffer-capacity=Устанавливает ёмкость внутреннего буфера персонального трансформатора МК1 в кДж.
personal-transformer-mk2-flow-limit=Устанавливает максимальную входную мощность персонального трансформатора МК2 в кВт.
personal-transformer-mk2-output-limit=Устанавливает максимальную выходную мощность персонального трансформатора МК2 в кВт.
personal-transformer-mk2-buffer-capacity=Устанавливает ёмкость внутреннего буфера персонального трансформатора МК2 в кДж.
personal-transformer-mk3-flow-limit=Устанавливает максимальную входную мощность персонального трансформатора МК3 в кВт.
personal-transformer-mk3-output-limit=Устанавливает максимальную выходную мощность персонального трансформатора МК3 в кВт.
personal-transformer-mk3-buffer-capacity=Устанавливает ёмкость внутреннего буфера персонального трансформатора МК3 в кДж.

