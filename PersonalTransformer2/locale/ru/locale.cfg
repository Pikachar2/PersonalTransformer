[technology-description]
personal-transformer-equipment=Вставленный в броню позволяет заряжаться от электрической сети. Мощность зарядки до 200kw.
personal-transformer-mk2-equipment=Позволяет улучшить зарядку от электрической сети. Мощность зарядки до 1MW.
personal-transformer-mk3-equipment=Позволяет игроку совершать блэкауты на аванпостах. Мощность зарядки до 4MW.
personal-transformer-efficiency=Увеличивает максимальную мощность приёма, отдачи и ёмкость буфера всех персональных трансформаторов. Примечание: бонусы исследования применяются в игре, но не отображаются в подсказках предметов и в Факториопедии.

[modifier-description]
personal-transformer-efficiency=Мощность и буфер персонального трансформатора: +__1__%
personal-transformer-efficiency-flat=Мощность персонального трансформатора: +__1__ кВт

