[technology-description]
personal-transformer-equipment=Inserido na armadura para permitir carregamento pela rede elétrica. Carrega a até 200 kW.
personal-transformer-mk2-equipment=Permite carregamento aprimorado pela rede elétrica. Carrega a até 1 MW.
personal-transformer-mk3-equipment=Permite ao jogador causar apagões em postos avançados. Carrega a até 4 MW.
personal-transformer-efficiency=Aumenta a capacidade máxima de entrada, saída e buffer de todos os transformadores pessoais. Nota: Os bônus pesquisados são aplicados no jogo, mas não aparecem nas dicas dos itens nem na Factoriopédia.

