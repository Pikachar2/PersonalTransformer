[mod-setting-description]
personal-transformer2-allow-non-armor=Permite colocar transformadores pessoais em grades de equipamento que não sejam armaduras.
personal-transformer2-tick-delay=Controla a frequência com que o script do transformador é executado (em ticks). Valores menores oferecem atualizações mais suaves com um custo ligeiramente maior de UPS; valores maiores economizam UPS.
personal-transformer2-default-vehicle-in=Define se veículos recém-colocados com transformadores pessoais iniciam com o carregamento da rede (Entrada) ativado.
personal-transformer2-default-vehicle-out=Define se veículos recém-colocados com transformadores pessoais iniciam com a descarga para a rede (Saída) ativada.
personal-transformer2-enable-research=Adiciona uma tecnologia infinita que aumenta a taxa de transferência e a capacidade de buffer de todos os transformadores pessoais.
personal-transformer2-research-bonus-type=Escolha se cada nível de pesquisa adiciona um multiplicador percentual ou um bônus fixo em kW.
personal-transformer2-research-bonus=Valor adicionado por nível pesquisado (porcentagem no modo percentual, ou kW no modo fixo).
personal-transformer2-research-cost-formula=Custo de pacotes científicos por nível L (começa em 1).\nSuporta: + - * / % ^ ( ) e floor, ceil, round, min, max, log, ln.\nDeve resultar > 0 para todos os níveis (sem sintaxe Lua).\nExemplos: (1.5 ^ (L - 1)) * 1000  |  2^(L - 1) * 1000  |  L * 1000
personal-transformer-mk1-flow-limit=Define a taxa máxima de entrada do transformador pessoal MK1 em kW.
personal-transformer-mk1-output-limit=Define a taxa máxima de saída do transformador pessoal MK1 em kW.
personal-transformer-mk1-buffer-capacity=Define a capacidade do buffer interno de energia do transformador pessoal MK1 em kJ.
personal-transformer-mk2-flow-limit=Define a taxa máxima de entrada do transformador pessoal MK2 em kW.
personal-transformer-mk2-output-limit=Define a taxa máxima de saída do transformador pessoal MK2 em kW.
personal-transformer-mk2-buffer-capacity=Define a capacidade do buffer interno de energia do transformador pessoal MK2 em kJ.
personal-transformer-mk3-flow-limit=Define a taxa máxima de entrada do transformador pessoal MK3 em kW.
personal-transformer-mk3-output-limit=Define a taxa máxima de saída do transformador pessoal MK3 em kW.
personal-transformer-mk3-buffer-capacity=Define a capacidade do buffer interno de energia do transformador pessoal MK3 em kJ.

