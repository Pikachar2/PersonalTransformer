[mod-setting-description]
personal-transformer2-allow-non-armor=Autorise l'insertion de transformateurs personnels dans les grilles d'équipement des véhicules.
personal-transformer2-tick-delay=Contrôle la fréquence d'exécution du script (en ticks). Des valeurs basses offrent des mises à jour plus fluides au prix d'un léger coût UPS ; des valeurs élevées économisent les UPS.
personal-transformer2-default-vehicle-in=Définit si les nouveaux véhicules équipés de transformateurs personnels démarrent avec la charge (Entrée) activée.
personal-transformer2-default-vehicle-out=Définit si les nouveaux véhicules équipés de transformateurs personnels démarrent avec la décharge (Sortie) activée.
personal-transformer2-enable-research=Ajoute une technologie infinie augmentant le débit et la capacité tampon de tous les transformateurs personnels.
personal-transformer2-research-bonus-type=Choisissez si chaque niveau de recherche ajoute un multiplicateur en pourcentage ou un bonus fixe en kW.
personal-transformer2-research-bonus=Valeur ajoutée par niveau recherché (pourcentage en mode pourcentage, ou kW en mode fixe).
personal-transformer2-research-cost-formula=Coût en packs de science par niveau L (commence à 1).\nPrend en charge : + - * / % ^ ( ) et floor, ceil, round, min, max, log, ln.\nDoit être > 0 pour tous les niveaux (pas de syntaxe Lua).\nExemples : (1.5 ^ (L - 1)) * 1000  |  2^(L - 1) * 1000  |  L * 1000
personal-transformer-mk1-flow-limit=Définit le débit d'entrée maximal du transformateur personnel MK1 en kW.
personal-transformer-mk1-output-limit=Définit le débit de sortie maximal du transformateur personnel MK1 en kW.
personal-transformer-mk1-buffer-capacity=Définit la capacité du tampon interne du transformateur personnel MK1 en kJ.
personal-transformer-mk2-flow-limit=Définit le débit d'entrée maximal du transformateur personnel MK2 en kW.
personal-transformer-mk2-output-limit=Définit le débit de sortie maximal du transformateur personnel MK2 en kW.
personal-transformer-mk2-buffer-capacity=Définit la capacité du tampon interne du transformateur personnel MK2 en kJ.
personal-transformer-mk3-flow-limit=Définit le débit d'entrée maximal du transformateur personnel MK3 en kW.
personal-transformer-mk3-output-limit=Définit le débit de sortie maximal du transformateur personnel MK3 en kW.
personal-transformer-mk3-buffer-capacity=Définit la capacité du tampon interne du transformateur personnel MK3 en kJ.

[string-mod-setting]
personal-transformer2-research-bonus-type-percentage=Pourcentage (%)
personal-transformer2-research-bonus-type-flat=Fixe (+kW)
