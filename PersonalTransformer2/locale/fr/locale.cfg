[technology-description]
personal-transformer-equipment=Inséré dans une armure pour permettre la recharge depuis le réseau électrique. Charge jusqu'à 200 kW.
personal-transformer-mk2-equipment=Améliore la recharge depuis le réseau électrique. Charge jusqu'à 1 MW.
personal-transformer-mk3-equipment=Permet au joueur de provoquer des coupures de courant dans les avant-postes. Charge jusqu'à 4 MW.
personal-transformer-efficiency=Augmente la capacité maximale d'entrée, de sortie et de tampon de tous les transformateurs personnels. Remarque : les bonus recherchés s'appliquent en jeu mais n'apparaissent pas dans les infobulles des objets ni dans la Factoriopédia.

